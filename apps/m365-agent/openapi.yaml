openapi: 3.0.3
info:
  title: XDCE Prototype API
  version: 0.1.0
servers:
  - url: https://REPLACE_WITH_DEPLOYED_HOST
paths:
  /api/components:
    get:
      operationId: listComponents
      summary: List verified XDCE components
      responses:
        "200":
          description: Catalog response
          content:
            application/json:
              schema:
                type: object
  /api/prototypes/generate:
    post:
      operationId: generatePrototype
      summary: Generate a prototype or structured requirement questions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Generated prototype, questions, or explicit catalog error
          content:
            application/json:
              schema:
                type: object
  /api/prototypes/validate:
    post:
      operationId: validatePrototype
      summary: Validate a canonical prototype document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
