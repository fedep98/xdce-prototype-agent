openapi: 3.0.3
info:
  title: XDCE Prototype API
  description: Copilot-safe adapter for the verified XDCE catalog and prototype generator.
  version: 0.2.0
servers:
  - url: ${{API_BASE_URL}}
paths:
  /api/copilot/components:
    get:
      operationId: listComponents
      summary: List verified XDCE components
      description: Returns a result field containing JSON text with verified components, options, constraints and provenance.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Catalog serialized in the result string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringResult"
  /api/copilot/generate:
    post:
      operationId: generatePrototype
      summary: Generate a prototype or structured requirement questions
      description: Pass the complete prototype request as JSON text in requestJson. Parse the JSON text returned in result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestJson]
              properties:
                requestJson:
                  type: string
                  description: JSON object text containing title, description, viewport, layout and components.
      responses:
        "200":
          description: Generation result serialized in the result string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringResult"
  /api/copilot/validate:
    post:
      operationId: validatePrototype
      summary: Validate a canonical prototype document
      description: Pass the complete prototype document as JSON text in prototypeJson. Parse the JSON text returned in result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prototypeJson]
              properties:
                prototypeJson:
                  type: string
                  description: Canonical prototype document encoded as JSON text.
      responses:
        "200":
          description: Validation result serialized in the result string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringResult"
components:
  schemas:
    StringResult:
      type: object
      required: [result]
      properties:
        result:
          type: string
          description: JSON text. Parse this string before interpreting the operation result.
